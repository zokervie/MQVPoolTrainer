# Codemagic – build app iOS "Pool Trainer" (thư mục ios/).
# Workflow mặc định tạo IPA KHÔNG KÝ: tải về rồi ký & cài bằng ESign / Sideloadly / AltStore với Apple ID miễn phí.
# Bản chính được build bằng GitHub Actions (.github/workflows/ios.yml → Release "ios-latest").
# Codemagic để chạy TAY khi cần (không tự build mỗi lần push, tránh build trùng và tốn phút miễn phí).
workflows:
  ios-unsigned:
    name: iOS – IPA không ký (ESign)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: 16.4   # ghim cùng bản với GitHub Actions
    scripts:
      - name: Cài XcodeGen
        script: brew install xcodegen
      - name: Kiểm thử engine vật lý (Swift)
        script: |
          swiftc -O ios/PoolTrainer/Core/*.swift ios/Tests/main.swift -o coretests
          ./coretests ios/Tests/fixture.json
      - name: Build IPA không ký
        script: ios/scripts/build-unsigned-ipa.sh
    artifacts:
      - ios/build/PoolTrainer.ipa
      - ios/build/xcodebuild.log
    publishing:
      email:
        recipients:
          - zokervie@gmail.com
        notify:
          success: true
          failure: true
