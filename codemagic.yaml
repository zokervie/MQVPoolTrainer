workflows:
  r0-swift-package-tests:
    name: "R0 - Swift package tests (macOS)"
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: "Environment and source verification"
        script: |
          set -eu
          sw_vers
          xcodebuild -version
          swift --version
          test -f Packages/PoolPhysics/Package.swift
          test -f Packages/PoolInput/Package.swift
          test -f Packages/PoolDrills/Package.swift
      - name: "R0.1 - PoolPhysics"
        script: |
          set -o pipefail
          swift test --package-path Packages/PoolPhysics 2>&1 | tee r0-poolphysics.log
      - name: "R0.2 - PoolInput"
        script: |
          set -o pipefail
          swift test --package-path Packages/PoolInput 2>&1 | tee r0-poolinput.log
      - name: "R0.2 - PoolDrills"
        script: |
          set -o pipefail
          swift test --package-path Packages/PoolDrills 2>&1 | tee r0-pooldrills.log
    artifacts:
      - "*.log"
