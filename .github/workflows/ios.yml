name: iOS – kiểm thử & build IPA

on:
  push:
    paths: ['ios/**', 'src/physics.js', 'src/drills.js', 'src/systems.js', 'src/table.js', '.github/workflows/ios.yml', 'codemagic.yaml']
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dữ liệu đối chiếu từ bản web phải khớp file đã lưu
        run: node ios/Tests/make-fixture.mjs > /tmp/fixture.json && cmp /tmp/fixture.json ios/Tests/fixture.json
      - name: Kiểm thử engine Swift
        run: |
          swiftc -O ios/PoolTrainer/Core/*.swift ios/Tests/main.swift -o coretests 2> swiftc.txt || { echo "::error title=swiftc::$(grep error: swiftc.txt | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }
          rc=0; ./coretests ios/Tests/fixture.json > core.txt || rc=$?
          cat core.txt
          echo "::notice title=core-tests::$(tail -n 1 core.txt)"
          if grep -q "✗" core.txt; then echo "::error title=core-fail::$(grep '✗' core.txt | head -60 | sed ':a;N;$!ba;s/\n/%0A/g')"; fi
          exit $rc

  build-ipa:
    runs-on: macos-15
    needs: core-tests
    steps:
      - uses: actions/checkout@v4
      - name: Cài XcodeGen
        run: brew install xcodegen
      - name: Build IPA (không ký – ký lại bằng ESign / Sideloadly)
        run: ios/scripts/build-unsigned-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PoolTrainer-unsigned-ipa
          path: ios/build/PoolTrainer.ipa

  simulator-shots:
    runs-on: macos-15
    needs: core-tests
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Cài XcodeGen
        run: brew install xcodegen
      - name: Chạy app trên Simulator và chụp màn hình
        run: ios/scripts/sim-shots.sh
      - name: Đẩy ảnh chụp lên nhánh ci-shots
        run: |
          echo "::notice title=sim-status::$(sed ':a;N;$!ba;s/\n/ | /g' ios/build/shots/status.txt)"
          cd ios/build/shots
          git init -q && git checkout -q -b ci-shots
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "shots ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-shots
