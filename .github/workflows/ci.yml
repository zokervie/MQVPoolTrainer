# CI Zoker MVP: test 4 Swift package → build IPA (Release, máy thật) → Release "zoker-latest";
# song song: đối chứng vật lý (validation) và chụp màn hình simulator.
# Lỗi biên dịch/test được chuyển thành annotation để đọc qua GitHub API.
name: CI

on:
  push:
    branches: [ "main", "ci/**", "feature/**" ]
  pull_request:
  workflow_dispatch: {}

# Không đặt concurrency cấp workflow: nó sẽ hủy cả bước đăng Release giữa chừng.
# Job kiểm thử: lần push mới hủy lần cũ. Job IPA/Release: xếp hàng, không hủy.

permissions:
  contents: read

env:
  # Ghim Xcode (không dùng action setup-xcode chạy Node 20).
  XCODE_APP: /Applications/Xcode_16.4.app

jobs:
  packages:
    runs-on: macos-15
    timeout-minutes: 25
    concurrency:
      group: ci-packages-${{ matrix.package }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        package: [ PoolPhysics, PoolInput, PoolDrills, PoolAudio ]
    steps:
      - uses: actions/checkout@v5
      - name: Chọn Xcode
        run: sudo xcode-select -s "$XCODE_APP"
      - name: Môi trường
        run: |
          echo "::notice title=env::$(xcodebuild -version | tr '\n' ' ') / $(swift --version 2>&1 | head -1)"
      - name: swift test (${{ matrix.package }})
        run: |
          set -o pipefail
          swift test --package-path "Packages/${{ matrix.package }}" 2>&1 | tee swift-test.log
      - name: Annotate
        if: always()
        run: .github/scripts/annotate.sh swift-test.log "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: log-${{ matrix.package }}
          path: swift-test.log
          retention-days: 14

  # R1.7 — KPI bắt buộc M2–M6 (UPGRADE.md 3.1) trên 10.000 cú ngẫu nhiên có seed, bản release.
  # Đỏ khi vi phạm. TẠM chưa chặn IPA (needs) cho tới khi sửa xong cú phá — xem PROGRESS R1.7.
  invariants:
    runs-on: macos-15
    timeout-minutes: 40
    concurrency:
      group: ci-invariants-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - name: Chọn Xcode
        run: sudo xcode-select -s "$XCODE_APP"
      - name: M2–M6 trên 10.000 cú (seed 2026)
        run: |
          set -o pipefail
          swift build -c release --package-path Packages/PoolPhysics --product poolsim 2>&1 | tee invariants.log | tail -3
          swift run -c release --skip-build --package-path Packages/PoolPhysics poolsim --invariants 10000 2026 2>&1 | tee -a invariants.log
      - name: Annotate
        if: always()
        run: .github/scripts/annotate.sh invariants.log "$GITHUB_WORKSPACE"

  # Bản thành phẩm cho iPhone thật (Release, arm64), chưa ký — cùng script với Codemagic.
  # Chỉ chạy khi test package qua. Push lên feature/zoker-mvp → đăng Release "zoker-latest" (link cố định cho ESign).
  ipa:
    runs-on: macos-15
    timeout-minutes: 40
    needs: packages
    permissions:
      contents: write
    concurrency:
      group: zoker-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - name: Chọn Xcode
        run: sudo xcode-select -s "$XCODE_APP"
      - name: Build IPA chưa ký
        id: ipa
        run: |
          set -o pipefail
          .github/scripts/build-unsigned-ipa.sh "${{ github.run_number }}" 2>&1 | tee ipa.log
          IPA=$(ls build/ipa/*.ipa)
          APP=build/Payload/PoolTrainer.app
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Info.plist")" = "${{ github.run_number }}"
          echo "file=$IPA" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$IPA" .ipa)" >> "$GITHUB_OUTPUT"
          echo "version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$IPA" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Annotate
        if: always()
        run: |
          grep -E "^IPA:" ipa.log | sed 's/^/::notice title=ipa::/' || true
          grep -E "error:" ipa.log | head -10 | sed 's/^/::error::/' || true
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.ipa.outputs.name }}
          path: ${{ steps.ipa.outputs.file }}
          retention-days: 30
      - name: Đăng bản build (Release theo từng build + link cố định)
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/zoker-mvp'
        env:
          GH_TOKEN: ${{ github.token }}
          IPA: ${{ steps.ipa.outputs.file }}
          VERSION: ${{ steps.ipa.outputs.version }}
          SHA256: ${{ steps.ipa.outputs.sha256 }}
          BUILD: ${{ github.run_number }}
        run: |
          set -euo pipefail
          trap 'echo "::error title=release::Lỗi ở dòng $LINENO: $BASH_COMMAND"' ERR
          B="${BUILD:-$BUILD_NUMBER}"
          TAG="zoker-v${VERSION}-b${B}"
          LINK="https://github.com/${GITHUB_REPOSITORY}/raw/dist-zoker/ZokerTrainer.ipa"
          cp "$IPA" ZokerTrainer.ipa
          NOTE="Zoker Trainer ${VERSION} (build ${B}) — nhánh feature/zoker-mvp, commit ${GITHUB_SHA::7}, $(date -u '+%Y-%m-%d %H:%M UTC').
          IPA chưa ký – mở bằng ESign/Sideloadly để ký bằng Apple ID của bạn rồi cài.
          Link cố định luôn trỏ bản mới nhất: ${LINK}
          SHA-256: ${SHA256}"
          # 1) Release riêng cho build này. Repo bật Release bất biến: không sửa/dời được Release cũ, nên mỗi build một tag mới.
          gh release create "$TAG" ZokerTrainer.ipa --target "$GITHUB_SHA" --prerelease \
            --title "Zoker Trainer ${VERSION} (build ${B})" --notes "$NOTE"
          # 2) Link cố định cho ESign: nhánh dist-zoker chỉ chứa bản mới nhất (ghi đè mỗi lần).
          mkdir -p _dist && cp ZokerTrainer.ipa _dist/ && printf '%s\n' "$NOTE" > _dist/BUILD.txt
          ( cd _dist && git init -q && git checkout -q -b dist-zoker \
            && git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com" \
            && git add -A && git commit -qm "Zoker Trainer ${VERSION} build ${B} (${GITHUB_SHA::7})" \
            && git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dist-zoker )
          # 3) Kiểm chứng: tải lại từ Release và từ nhánh phân phối, so mã băm.
          gh release download "$TAG" -p ZokerTrainer.ipa -O check.ipa --clobber
          test "$(shasum -a 256 check.ipa | cut -d' ' -f1)" = "$SHA256"
          gh api "repos/$GITHUB_REPOSITORY/contents/ZokerTrainer.ipa?ref=dist-zoker" -H "Accept: application/vnd.github.raw" > check2.ipa
          test "$(shasum -a 256 check2.ipa | cut -d' ' -f1)" = "$SHA256"
          # 4) Dọn: giữ 10 Release gần nhất của app này (Release bất biến vẫn xóa được; lỗi thì bỏ qua).
          gh release list --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[].tagName' \
            | grep '^zoker-v' | tail -n +11 | while read -r old; do gh release delete "$old" -y || true; done
          echo "::notice title=release::$TAG · link cố định: $LINK"

  # Tầng 2 (đối chứng pooltool) và kiểm thử công cụ đo. Chỉ để báo cáo, không chặn CI.
  validation:
    runs-on: macos-15
    timeout-minutes: 40
    concurrency:
      group: ci-validation-${{ github.ref }}
      cancel-in-progress: true
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Chọn Xcode
        run: sudo xcode-select -s "$XCODE_APP"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Kiểm thử công cụ đo (Tools/validation)
        run: |
          pip install numpy > /dev/null
          python -m unittest discover -s Tools/validation 2>&1 | tee validation.log
      - name: Đo hiệu năng bộ giải (release)
        run: swift run -c release --package-path Packages/PoolPhysics poolsim --bench 2>&1 | tail -2 | tee -a validation.log
      - name: Đối chứng pooltool
        run: |
          pip install pooltool-billiards 2>&1 | tail -2 | tee -a validation.log
          python Tools/validation/pooltool_compare.py make scen.json 2>&1 | tee -a validation.log
          swift run -c release --package-path Packages/PoolPhysics poolsim scen.json ours.json 2>&1 | tail -3 | tee -a validation.log
          python Tools/validation/pooltool_compare.py report scen.json ours.json 2>&1 | sed 's/^REPORT: P/REPORT: [base] P/' | tee -a validation.log
          # Chẩn đoán băng: pooltool đổi sang mô hình băng Han (2005) — cùng họ với mô hình của PoolPhysics.
          # Nếu sai số băng giảm mạnh → chênh lệch ở [base] là do CHỌN MÔ HÌNH (Stronge vs Han), không phải lỗi cài đặt.
          set +e
          python Tools/validation/pooltool_compare.py make scen_han.json han2005 > han.log 2>&1 || echo "Error: han2005 variant: $(tail -1 han.log)" | tee -a validation.log
          grep "REPORT: pooltool [0-9]\|params used" han.log | sed 's/^REPORT: /REPORT: [han2005] /' | tee -a validation.log
          swift run -c release --package-path Packages/PoolPhysics poolsim scen_han.json ours_han.json 2>&1 | tail -1
          python Tools/validation/pooltool_compare.py report scen_han.json ours_han.json 2>&1 | sed 's/^REPORT: P/REPORT: [han2005] P/' | tee -a validation.log
          # So TỪNG va chạm băng thẳng (Han 2005): công thức và hình học đường băng.
          swift run -c release --package-path Packages/PoolPhysics poolsim --cushion scen_han.json ours_cev.json 2>&1 | tail -1
          python Tools/validation/pooltool_compare.py cushion-report scen_han.json ours_cev.json 2>&1 | sed 's/^REPORT: P/REPORT: [han2005] P/' | tee -a validation.log
          # Độ nhạy chiều cao mũi băng: PoolPhysics mặc định 0,635·2R, pooltool 0,64·2R.
          python Tools/validation/pooltool_compare.py variant scen_han.json scen_h635.json table.cushionHeightRatio=0.635
          swift run -c release --package-path Packages/PoolPhysics poolsim scen_h635.json ours_h635.json 2>&1 | tail -1
          python Tools/validation/pooltool_compare.py report scen_h635.json ours_h635.json 2>&1 | grep "P1 cushion\|P1 jaw\|P2 " | sed 's/^REPORT: P/REPORT: [han2005, h=0.635] P/' | tee -a validation.log
      - name: Annotate
        if: always()
        run: .github/scripts/annotate.sh validation.log "$GITHUB_WORKSPACE"

  # Kiểm tra hình ảnh: chạy app trên iOS Simulator với -autotest, chụp màn hình, đẩy lên nhánh shots/zoker.
  screenshots:
    runs-on: macos-15
    timeout-minutes: 40
    concurrency:
      group: ci-screenshots-${{ github.ref }}
      cancel-in-progress: true
    continue-on-error: true
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Chọn Xcode
        run: sudo xcode-select -s "$XCODE_APP"
      - name: Build cho simulator
        run: |
          brew install xcodegen > /dev/null
          xcodegen generate
          set -o pipefail
          xcodebuild build -project PoolTrainer.xcodeproj -scheme PoolTrainer \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO > shots-build.log 2>&1 \
            || { grep -E "error:" shots-build.log | head -20 | sed 's/^/::error::/'; exit 1; }
      - name: Chụp màn hình
        run: |
          .github/scripts/screenshots.sh build/Build/Products/Debug-iphonesimulator/PoolTrainer.app 2>&1 | tee shots.log
          # App phải thực sự chạy: mỗi kịch bản ghi một file chẩn đoán. Không có file nào = app không mở được.
          n=$(ls shots/autotest-*.txt 2>/dev/null | wc -l | tr -d ' ')
          [ "$n" -ge 5 ] || { echo "::error title=screenshots::App không chạy trên simulator (chỉ có $n file chẩn đoán)"; exit 1; }
      - name: Xuất âm thanh để nghe thử
        run: swift run --package-path Packages/PoolAudio audiodump shots/audio 2>&1 | tail -2 | tee -a shots.log
      - name: Đẩy ảnh lên nhánh shots/zoker
        run: |
          SHA=$(git rev-parse --short HEAD)
          cd shots
          git init -q
          git config user.name "ci-screenshots"
          git config user.email "ci@users.noreply.github.com"
          git checkout -q -b shots/zoker
          git add -A
          git commit -q -m "screenshots for ${SHA}"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" shots/zoker
          echo "REPORT: screenshots pushed to shots/zoker for ${SHA}" | tee -a ../shots.log
      - name: Annotate
        if: always()
        run: .github/scripts/annotate.sh shots.log "$GITHUB_WORKSPACE"
