# CI: test các Swift package và build app iOS (simulator) trên macOS.
# Lỗi biên dịch/test được chuyển thành annotation để đọc qua GitHub API.
name: CI

on:
  push:
    branches: [ "main", "ci/**", "feature/**" ]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  packages:
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        package: [ PoolPhysics, PoolInput, PoolDrills, PoolAudio ]
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16"
      - name: Môi trường
        run: |
          echo "::notice title=env::$(xcodebuild -version | tr '\n' ' ') / $(swift --version 2>&1 | head -1)"
      - name: swift test (${{ matrix.package }})
        run: |
          set -o pipefail
          swift test --package-path "Packages/${{ matrix.package }}" 2>&1 | tee swift-test.log
      - name: Annotate
        if: always()
        run: .github/scripts/annotate.sh swift-test.log "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-${{ matrix.package }}
          path: swift-test.log
          retention-days: 14

  app:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16"
      - name: XcodeGen
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build app (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild build \
            -project PoolTrainer.xcodeproj \
            -scheme PoolTrainer \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            > app-build.log 2>&1 || true
          tail -5 app-build.log
          grep -q "BUILD SUCCEEDED" app-build.log
      - name: Annotate
        if: always()
        run: .github/scripts/annotate.sh app-build.log "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-app
          path: app-build.log
          retention-days: 14

  # Tầng 2 (đối chứng pooltool) và kiểm thử công cụ đo. Chỉ để báo cáo, không chặn CI.
  validation:
    runs-on: macos-15
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kiểm thử công cụ đo (Tools/validation)
        run: |
          pip install numpy > /dev/null
          python -m unittest discover -s Tools/validation 2>&1 | tee validation.log
      - name: Đối chứng pooltool
        run: |
          pip install pooltool-billiards 2>&1 | tail -2 | tee -a validation.log
          python Tools/validation/pooltool_compare.py make scen.json 2>&1 | tee -a validation.log
          swift run -c release --package-path Packages/PoolPhysics poolsim scen.json ours.json 2>&1 | tail -3 | tee -a validation.log
          python Tools/validation/pooltool_compare.py report scen.json ours.json 2>&1 | sed 's/^REPORT: P/REPORT: [base] P/' | tee -a validation.log
          # Biến thể chẩn đoán: không ma sát bi–bi (để kiểm tra giả thuyết lệch do mô hình throw).
          python Tools/validation/pooltool_compare.py variant scen.json scen_nofric.json ballBallFriction=0
          swift run -c release --package-path Packages/PoolPhysics poolsim scen_nofric.json ours_nofric.json 2>&1 | tail -1
          python Tools/validation/pooltool_compare.py report scen_nofric.json ours_nofric.json 2>&1 | sed 's/^REPORT: P/REPORT: [no-friction] P/' | tee -a validation.log
      - name: Annotate
        if: always()
        run: .github/scripts/annotate.sh validation.log "$GITHUB_WORKSPACE"
