# CI: test các Swift package và build app iOS (simulator) trên macOS.
# Lỗi biên dịch/test được chuyển thành annotation để đọc qua GitHub API.
name: CI

on:
  push:
    branches: [ "main", "ci/**", "feature/**" ]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  packages:
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        package: [ PoolPhysics, PoolInput, PoolDrills, PoolAudio ]
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16"
      - name: Môi trường
        run: |
          echo "::notice title=env::$(xcodebuild -version | tr '\n' ' ') / $(swift --version 2>&1 | head -1)"
      - name: swift test (${{ matrix.package }})
        run: |
          set -o pipefail
          swift test --package-path "Packages/${{ matrix.package }}" 2>&1 | tee swift-test.log
      - name: Annotate
        if: always()
        run: .github/scripts/annotate.sh swift-test.log "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-${{ matrix.package }}
          path: swift-test.log
          retention-days: 14

  app:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16"
      - name: XcodeGen
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build app (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild build \
            -project PoolTrainer.xcodeproj \
            -scheme PoolTrainer \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            > app-build.log 2>&1 || true
          tail -5 app-build.log
          grep -q "BUILD SUCCEEDED" app-build.log
      - name: Annotate
        if: always()
        run: .github/scripts/annotate.sh app-build.log "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-app
          path: app-build.log
          retention-days: 14

  # Tầng 2 (đối chứng pooltool) và kiểm thử công cụ đo. Chỉ để báo cáo, không chặn CI.
  validation:
    runs-on: macos-15
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kiểm thử công cụ đo (Tools/validation)
        run: |
          pip install numpy > /dev/null
          python -m unittest discover -s Tools/validation 2>&1 | tee validation.log
      - name: Đo hiệu năng bộ giải (release)
        run: swift run -c release --package-path Packages/PoolPhysics poolsim --bench 2>&1 | tail -2 | tee -a validation.log
      - name: Đối chứng pooltool
        run: |
          pip install pooltool-billiards 2>&1 | tail -2 | tee -a validation.log
          python Tools/validation/pooltool_compare.py make scen.json 2>&1 | tee -a validation.log
          swift run -c release --package-path Packages/PoolPhysics poolsim scen.json ours.json 2>&1 | tail -3 | tee -a validation.log
          python Tools/validation/pooltool_compare.py report scen.json ours.json 2>&1 | sed 's/^REPORT: P/REPORT: [base] P/' | tee -a validation.log
          # Chẩn đoán băng: pooltool đổi sang mô hình băng Han (2005) — cùng họ với mô hình của PoolPhysics.
          # Nếu sai số băng giảm mạnh → chênh lệch ở [base] là do CHỌN MÔ HÌNH (Stronge vs Han), không phải lỗi cài đặt.
          set +e
          python Tools/validation/pooltool_compare.py make scen_han.json han2005 > han.log 2>&1 || echo "Error: han2005 variant: $(tail -1 han.log)" | tee -a validation.log
          grep "REPORT: pooltool [0-9]\|params used" han.log | sed 's/^REPORT: /REPORT: [han2005] /' | tee -a validation.log
          swift run -c release --package-path Packages/PoolPhysics poolsim scen_han.json ours_han.json 2>&1 | tail -1
          python Tools/validation/pooltool_compare.py report scen_han.json ours_han.json 2>&1 | sed 's/^REPORT: P/REPORT: [han2005] P/' | tee -a validation.log
          # Độ nhạy chiều cao mũi băng: PoolPhysics mặc định 0,635·2R, pooltool 0,64·2R.
          python Tools/validation/pooltool_compare.py variant scen_han.json scen_h635.json table.cushionHeightRatio=0.635
          swift run -c release --package-path Packages/PoolPhysics poolsim scen_h635.json ours_h635.json 2>&1 | tail -1
          python Tools/validation/pooltool_compare.py report scen_h635.json ours_h635.json 2>&1 | grep "P1 cushion\|P1 jaw\|P2 " | sed 's/^REPORT: P/REPORT: [han2005, h=0.635] P/' | tee -a validation.log
      - name: Annotate
        if: always()
        run: .github/scripts/annotate.sh validation.log "$GITHUB_WORKSPACE"

  # Kiểm tra hình ảnh: chạy app trên iOS Simulator với -autotest, chụp màn hình, đẩy lên nhánh shots/zoker.
  screenshots:
    runs-on: macos-15
    timeout-minutes: 40
    continue-on-error: true
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16"
      - name: Build cho simulator
        run: |
          brew install xcodegen > /dev/null
          xcodegen generate
          set -o pipefail
          xcodebuild build -project PoolTrainer.xcodeproj -scheme PoolTrainer \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO > shots-build.log 2>&1 || true
          tail -3 shots-build.log
      - name: Chụp màn hình
        run: |
          .github/scripts/screenshots.sh build/Build/Products/Debug-iphonesimulator/PoolTrainer.app 2>&1 | tee shots.log
      - name: Xuất âm thanh để nghe thử
        run: swift run --package-path Packages/PoolAudio audiodump shots/audio 2>&1 | tail -2 | tee -a shots.log
      - name: Đẩy ảnh lên nhánh shots/zoker
        run: |
          SHA=$(git rev-parse --short HEAD)
          cd shots
          git init -q
          git config user.name "ci-screenshots"
          git config user.email "ci@users.noreply.github.com"
          git checkout -q -b shots/zoker
          git add -A
          git commit -q -m "screenshots for ${SHA}"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" shots/zoker
          echo "REPORT: screenshots pushed to shots/zoker for ${SHA}" | tee -a ../shots.log
      - name: Annotate
        if: always()
        run: .github/scripts/annotate.sh shots.log "$GITHUB_WORKSPACE"
