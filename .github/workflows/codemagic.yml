# Cầu nối GitHub Actions → Codemagic REST API: thêm app (nếu chưa có), chạy workflow, chờ xong,
# báo link tải artifact (hạn 7 ngày) hoặc log lỗi dưới dạng annotation.
# Kích hoạt: sửa file .github/codemagic-request.json trên nhánh feature/zoker-mvp, ví dụ
#   {"workflow": "zoker-ipa-unsigned", "request": 2}   (tăng "request" để chạy lại)
name: Codemagic
on:
  push:
    branches: [feature/zoker-mvp]
    paths: [".github/codemagic-request.json"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Build trên Codemagic
        env:
          CODEMAGIC_API_TOKEN: ${{ secrets.CODEMAGIC_API_TOKEN }}
          CM_BRANCH: feature/zoker-mvp
        run: |
          export CM_WORKFLOW=$(python3 -c 'import json;print(json.load(open(".github/codemagic-request.json")).get("workflow","zoker-ipa-unsigned"))')
          python3 .github/scripts/codemagic_build.py
