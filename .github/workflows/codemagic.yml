# Cầu nối GitHub Actions → Codemagic REST API: thêm app (nếu chưa có), chạy workflow, chờ xong,
# báo link tải artifact (hạn 7 ngày) hoặc log lỗi dưới dạng annotation.
# Kích hoạt bằng tag (không cần sửa nhánh main):
#   git tag cm-ipa-<số> && git push origin cm-ipa-<số>               → zoker-ipa-unsigned
#   git tag cm-testflight-<số> && git push origin cm-testflight-<số> → zoker-testflight
name: Codemagic
on:
  push:
    tags: ["cm-ipa-*", "cm-testflight-*"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build trên Codemagic
        env:
          CODEMAGIC_API_TOKEN: ${{ secrets.CODEMAGIC_API_TOKEN }}
          CM_WORKFLOW: ${{ startsWith(github.ref_name, 'cm-testflight-') && 'zoker-testflight' || 'zoker-ipa-unsigned' }}
          CM_BRANCH: feature/zoker-mvp
        run: python3 .github/scripts/codemagic_build.py
