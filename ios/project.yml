name: PoolTrainer
options:
  bundleIdPrefix: com.zoker
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  PoolTrainer:
    type: application
    platform: iOS
    sources:
      - path: PoolTrainer
      - path: Drills
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zoker.pooltrainer
        PRODUCT_NAME: PoolTrainer
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "3.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Pool Trainer
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.sports-games
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OPTIMIZATION_LEVEL: "-O"
