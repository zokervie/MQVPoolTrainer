workflows:
  zoker-010-zupe-experimental:
    name: Zoker 0.10 + ZUPE Lab - unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      node: 20
    scripts:
      - name: Resource, research and C++ checks
        script: bash Run-All-Checks.command
      - name: Compile iOS Simulator
        script: bash Verify-on-Mac.command
      - name: Build unsigned device IPA
        script: bash Build-Unsigned-IPA.command
    artifacts:
      - dist/*.ipa
      - build/*.log
